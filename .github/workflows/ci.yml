name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (ruff, pytest, trace validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The full XQsim dependency set (Qiskit 0.23, Ray 2.5, ...) is heavy and
      # only needed to generate traces; CI checks the pure-Python parts.
      - run: python -m pip install ruff pytest numpy
      - run: ruff check .
      - run: ruff format --check qustitch_trace tools tests
      - run: python -m pytest -q
      - run: python tools/validate_trace.py ../frontend/public/circuit_*.json
